[project]
name = "ensembl-vep"
description = "Ensembl VEP (Variant Effect Predictor) predicts the functional effects of genomic variants."
requires-python = ">= 3.12"
dynamic = [
    "version",
]
readme = "README.md"
authors = [
    {name = "Ensembl", email = "dev@ensembl.org"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
"ensembl",
    "ensembl-vep",
    "bioinformatics",
    "annotation",
    "variants",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "attrs>=24.1.0",
]

# dependencies = [
#     "biopython",
#     "ensembl-utils @ git+https://github.com/Ensembl/ensembl-utils.git",
# ]

[project.optional-dependencies]
build = [
    "build",
    "setuptools",
    "setuptools-rust",
    "setuptools-scm",
    "wheel",
]
cicd = [
    "black",
    "coverage",
    "genbadge[coverage]",
    "mypy",
    "pylint",
    "pytest-dependency",
]
docs = [
    "mkdocs >= 1.5.3",
    "mkdocs-autorefs",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-material",
    "mkdocs-material-extensions",
    "mkdocs-section-index",
    "mkdocstrings",
    "mkdocstrings-python",
]

[project.urls]
Homepage = "https://www.ensembl.org"
Documentation = "https://ensembl.github.io/ensembl-vep-py"
Repository = "https://github.com/Ensembl/ensembl-vep-py"
Issues = "https://github.com/Ensembl/ensembl-vep-py/issues"
Changelog = "ithub.com/Ensembl/ensembl-vep-py/blob/main/CHANGELOG.md"

[project.scripts]
vep = "ensembl.vep.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ensembl.vep.__version__"}

[tool.setuptools.packages.find]
where = ["src/python"]

[[tool.setuptools-rust.ext-modules]]
# Private Rust extension module to be nested into the Python package
target = "ensembl.vep.ensembl_vep_core"
path = "Cargo.toml"
binding = "PyO3"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "setuptools-rust",
    "setuptools-scm",
    "wheel",
]

[tool.setuptools-scm]

[tool.black]
line-length = 110

[tool.pylint]
max-branches = 15

[tool.pylint.format]
max-line-length = 110

[tool.pylint.messages_control]
disable = [
    "abstract-method",
    "invalid-name",
    "logging-fstring-interpolation",
    "similarities",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-statements",
    "unspecified-encoding",
    "wildcard-import"
]

[tool.ruff]
line-length = 110
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
# Ignore `F403` (unable to detect undefined names) in all `__init__.py` files
"__init__.py" = ["F403"]

[tool.mypy]
mypy_path = "src/python"
disallow_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--tb=native",
]
testpaths = ["src/python/tests"]
norecursedirs = ["docs", "*.egg_info"]

[tool.coverage.run]
branch = true
source = [
    "ensembl.vep",
]

[tool.coverage.report]
exclude_also = [
    # Do not complain about missing debug-only code
    "def __repr__",
    "if self\\.debug",
    "if settings\\.DEBUG",
    # Do not complain if tests do not hit defensive assertion code
    "raise AssertionError",
    "raise NotImplementedError",
    # Do not complain if non-runnable code is not run
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def main",
    "def .*_cli",
    # Do not complain about abstract methods, they are not run
    "@(abc\\.)?abstractmethod",
]
