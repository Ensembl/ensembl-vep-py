<text x="355.0" y="285.0" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#495057">argparse flags</text>
<rect x="530" y="133" width="140" height="64" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
