<text x="760.0" y="180.0" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#495057">later wins</text>
<rect x="850" y="133" width="130" height="64" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="915.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Config</text>
<text x="915.0" y="180.0" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#495057">+ defaults</text>
