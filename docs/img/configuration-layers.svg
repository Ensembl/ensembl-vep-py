<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="How an option declaration becomes command-line, environment and file layers that merge into a Config">
<title>How an option declaration becomes command-line, environment and file layers that merge into a Config</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
<rect width="1000" height="330" fill="#ffffff"/>
<rect x="20" y="133" width="170" height="64" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="105.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">option()</text>
<text x="105.0" y="180.0" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#495057">on a section field</text>
