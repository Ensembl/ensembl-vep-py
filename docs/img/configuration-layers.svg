<text x="355.0" y="75.0" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#495057">TOML or Perl VEP</text>
<rect x="250" y="135" width="210" height="60" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="355.0" y="160.0" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">environment</text>
<text x="355.0" y="180.0" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#495057">ENSEMBL_VEP_*</text>
<rect x="250" y="240" width="210" height="60" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
