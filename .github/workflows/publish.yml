name: Upload Python package to PyPI when a release is created

on:
  release:
    types: [created]
  # Manual runs build wheels and the sdist only (no docs deploy, no PyPI upload), for testing the build matrix.
  workflow_dispatch:

defaults:
  run:
    working-directory: ./

env:
  PYTHON_VERSION: "3.12"

jobs:
  docs:
    name: Deploy documentation to GitHub Pages
    if: github.event_name == 'release'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
    with:
      python-version: "3.12"
      tag: ${{ github.event.release.tag_name }}

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux + musllinux, x86_64
          - ubuntu-24.04-arm   # manylinux + musllinux, aarch64
          - macos-latest       # arm64
          - macos-15-intel     # x86_64
          - windows-latest     # AMD64
          - windows-11-arm     # ARM64

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          tags: "build"

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  pypi-publish:
    name: Publish release to PyPI
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ensembl-vep
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
