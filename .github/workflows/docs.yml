name: 'Deploy documentation'
run-name: ${{ github.actor }} triggered mkdocs generation

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version
        default: '3.10'
        required: true
        type: string

jobs:
  mkdocs:
    name: Deploy documentation to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "cicd,docs"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          uv run coverage run -m pytest
          uv run coverage lcov -o ./reports/pytest.lcov

          cargo llvm-cov --lcov --output-path rust-coverage.lcov
          cargo llvm-cov --html --output-dir rust-coverage-html

      - name: Generate coverage badge
        run: |
          bash .github/scripts/generate_coverage_badge.sh rust-coverage.lcov .github/badges

          mkdir -p docs/assets/badges
          cp .github/badges/coverage.json docs/assets/badges/
          cp -r rust-coverage-html docs/coverage

      - name: Generate coverage badge
        run: |
          PY_COVERAGE=$(awk -F: '
            /^LH:/ { hit += $2 }
            /^LF:/ { total += $2 }
            END { 
              if (total > 0) 
                printf "%.2f", (hit/total)*100 
              else 
                print "0.00"
            }
          ' ./reports/pytest.lcov)
          curl -s "https://img.shields.io/badge/coverage-${PY_COVERAGE}%25-brightgreen?logo=rust" > ./reports/htmlcov/py-coverage-badge.svg

          RUST_COVERAGE=$(awk -F: '
            /^LH:/ { hit += $2 }
            /^LF:/ { total += $2 }
            END { 
              if (total > 0) 
                printf "%.2f", (hit/total)*100 
              else 
                print "0.00"
            }
          ' ./reports/rust.lcov)
          curl -s "https://img.shields.io/badge/coverage-${RUST_COVERAGE}%25-brightgreen?logo=rust" > ./reports/htmlcov/rust-coverage-badge.svg

      - name: Run mkdocs
        run: |
          uv run mkdocs gh-deploy --force
