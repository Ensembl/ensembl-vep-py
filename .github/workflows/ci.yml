name: "CI"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  license_check:
    name: Check missing license headers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check license header
        uses: apache/skywalking-eyes/header@v0.8.0
        with:
          config: .licenserc.yml

  python_ci:
    name: Python CI
    uses: ./.github/workflows/python_ci.yml
    with:
      python-version: "3.12"

  rust_ci:
    name: Rust CI
    uses: ./.github/workflows/rust_ci.yml

  tabix_integration:
    name: Tabix integration (HTSlib ${{ matrix.htslib-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        htslib-version:
          - "1.9"
          - "1.13"
          - "1.17"
          - "1.21"
          - "1.23"

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python_build
        with:
          python-version: "3.12"
          tags: "cicd"

      - name: Install HTSlib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libbz2-dev \
            libcurl4-openssl-dev \
            liblzma-dev \
            zlib1g-dev

      - name: Cache HTSlib
        id: cache-htslib
        uses: actions/cache@v4
        with:
          path: .htslib/${{ matrix.htslib-version }}
          key: htslib-${{ runner.os }}-${{ matrix.htslib-version }}

      - name: Build HTSlib
        if: steps.cache-htslib.outputs.cache-hit != 'true'
        env:
          ENSEMBL_VEP_HTSLIB_VERSION: ${{ matrix.htslib-version }}
        run: |
          mkdir -p .htslib/src
          curl -L "https://github.com/samtools/htslib/releases/download/${ENSEMBL_VEP_HTSLIB_VERSION}/htslib-${ENSEMBL_VEP_HTSLIB_VERSION}.tar.bz2" \
            -o ".htslib/src/htslib-${ENSEMBL_VEP_HTSLIB_VERSION}.tar.bz2"
          tar -xjf ".htslib/src/htslib-${ENSEMBL_VEP_HTSLIB_VERSION}.tar.bz2" -C .htslib/src
          cd ".htslib/src/htslib-${ENSEMBL_VEP_HTSLIB_VERSION}"
          ./configure --prefix="${GITHUB_WORKSPACE}/.htslib/${ENSEMBL_VEP_HTSLIB_VERSION}"
          make -j"$(nproc)" bgzip tabix
          make install

      - name: Show tabix version
        env:
          ENSEMBL_VEP_HTSLIB_BIN: ${{ github.workspace }}/.htslib/${{ matrix.htslib-version }}/bin
        run: |
          "${ENSEMBL_VEP_HTSLIB_BIN}/tabix" --version

      - name: Run Python tabix integration tests
        run: |
          uv run pytest src/python/tests -m integration --run-integration --no-install-htslib \
            --htslib-bin "${{ github.workspace }}/.htslib/${{ matrix.htslib-version }}/bin" \
            --htslib-version "${{ matrix.htslib-version }}" \
            -q

      - name: Run Rust tabix integration tests
        env:
          ENSEMBL_VEP_HTSLIB_BIN: ${{ github.workspace }}/.htslib/${{ matrix.htslib-version }}/bin
        run: |
          cargo test --test tabix_integration -- --ignored
