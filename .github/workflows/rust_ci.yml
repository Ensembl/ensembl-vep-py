name: "Rust CI"

on:
  workflow_call:

defaults:
  run:
    working-directory: ./

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Cargo fmt
        run: |
          cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run clippy
        run: |
          cargo clippy --all --all-features --tests -- -D warnings

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
        
      - name: Run tests with coverage
        run: |
          cargo llvm-cov --lcov --output-path coverage.lcov
        
      - name: Add coverage reports
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/rust_coverage_comment.sh coverage.lcov