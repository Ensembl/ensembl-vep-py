name: "Python CI"

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run the CI checks on
        required: true
        type: string

defaults:
  run:
    working-directory: ./

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "cicd"

      - name: Run pylint
        run: |
          uv run pylint --rcfile pyproject.toml src/python/ensembl
          uv run pylint --rcfile pyproject.toml src/python/tests

  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "cicd"

      - name: Run mypy
        run: |
          uv run mypy --config-file pyproject.toml src/python/ensembl

  black:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "cicd"

      - name: Run black
        run: |
          uv run black --config pyproject.toml --check .

  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "cicd"

      - name: Run pytest with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage lcov -o coverage.lcov

      - name: Add coverage reports
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/py_coverage_comment.sh coverage.lcov
