name: "Python CI"

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run the CI checks on
        required: true
        type: string

defaults:
  run:
    working-directory: ./

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "cicd"

      - name: Run pylint checks on source and test code
        run: |
          make lint-py

  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "cicd"

      - name: Run static type checking on source code
        run: |
          make type-check

  black:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "cicd"

      - name: Run black
        run: |
          make format-py-check

  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "cicd"

      - name: Run pytest with coverage
        id: unittest
        run: |
          uv run coverage run -m pytest

      - name: Add coverage reports
        if: ${{ github.event_name == 'pull_request' && (steps.unittest.outcome == 'success' || (failure() && steps.unittest.outcome == 'failure')) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run coverage lcov -o coverage.lcov
          bash .github/scripts/py_coverage_comment.sh coverage.lcov
