[package]
name = "ensembl_vep_core"
version = "0.1.0"
edition = "2024"

[dependencies]
pyo3 = "0.27.0"
pyo3-log = "0.13.3"
log = "0.4"
noodles-bgzf = "0.46.0"
noodles-csi = "0.55.0"
noodles-core = "0.19.0"
noodles-tabix = "0.61.0"

[dev-dependencies]
rstest = "0.23.0"

[profile.release-lto]
inherits = "release"
lto = true

[lib]
name = "ensembl_vep_core"
path = "src/rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[[test]]
name = "hello_integration"
path = "src/rust/tests/hello_integration_tests.rs"

[[test]]
name = "tabix_integration"
path = "src/rust/tests/tabix_integration_tests.rs"

# Tabix integration tests are ignored by default because they require bgzip and tabix:
## ENSEMBL_VEP_HTSLIB_BIN=/path/to/htslib/bin cargo test --test tabix_integration -- --ignored

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# See also PyO3 docs on writing Cargo.toml files at https://pyo3.rs
