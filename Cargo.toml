[package]
name = "ensembl_vep_core"
version = "0.1.0"
edition = "2024"

[dependencies]
pyo3 = "0.27.0"

[profile.release-lto]
inherits = "release"
lto = true

[lib]
name = "_ensembl_vep_core"
path = "src/rust/lib.rs"
crate-type = ["cdylib"]

