[package]
name = "ensembl_vep_core"
version = "0.1.0"
edition = "2024"

[dependencies]
pyo3 = "0.27.0"
pyo3-log = "0.13.3"
log = "0.4"
noodles-bgzf = "0.46.0"
noodles-csi = "0.55.0"
noodles-core = "0.19.0"
noodles-tabix = "0.61.0"

[profile.release-lto]
inherits = "release"
lto = true

[lib]
name = "ensembl_vep_core"
path = "src/rust/lib.rs"
crate-type = ["cdylib"]

[[test]]
name = "ensembl_vep_core"
path = "src/rust/tests/integration_tests.rs"

# for cargo test you need to first run: 
## export DYLD_LIBRARY_PATH="/path/to/dir/with/libpython3.10.dylib:$DYLD_LIBRARY_PATH" (or, 3.12)
## need an alternative to that
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# See also PyO3 docs on writing Cargo.toml files at https://pyo3.rs
