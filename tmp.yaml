- name: Install dependencies
  run: |
    EXTRAS="${{ inputs.extras }}"
    EXTRA_FLAGS=$(echo "$EXTRAS" | tr ',' '\n' | sed 's/^/--extra /' | tr '\n' ' ')
    uv sync $EXTRA_FLAGS


# Input as comma-separated
inputs:
  extras:
    description: 'Extras to install (comma-separated)'
    default: 'dev,test,build'

- name: Install dependencies
  run: |
    EXTRAS='${{ inputs.extras }}'
    echo "$EXTRAS" | jq -r '.[]' | while read extra; do
      uv sync --extra "$extra"
    done

inputs:
  extras:
    description: 'Extras as JSON array'
    default: '["dev", "test", "build"]'
    type: string